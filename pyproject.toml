[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nan-safe-trainer"
version = "0.1.0"
description = "Automatic NaN detection and checkpoint recovery for MLX LoRA training"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Christopher Chanhnourack"}]
keywords = ["mlx", "apple-silicon", "lora", "training", "nan", "machine-learning", "fine-tuning"]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/cjchanh/nan-safe-trainer"
Repository = "https://github.com/cjchanh/nan-safe-trainer"
Issues = "https://github.com/cjchanh/nan-safe-trainer/issues"

[project.scripts]
nan-safe-train = "nan_safe_trainer.cli:run"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
