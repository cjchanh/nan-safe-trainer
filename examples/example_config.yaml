# Example MLX LoRA training config
# Adjust model, data, and adapter_path for your setup.

model: "Qwen/Qwen3-32B-MLX-4bit"
train: true
fine_tune_type: lora
optimizer: adam
data: "./data/placeholder"
seed: 137
num_layers: 16
batch_size: 1
iters: 600
val_batches: 25
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 30
grad_accumulation_steps: 4
resume_adapter_file: null
adapter_path: "./adapters/placeholder"
save_every: 30
test: false
test_batches: 50
max_seq_length: 2048
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 16
  scale: 16.0
  dropout: 0.0
